server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/userManagement?useSSL=false&serverTimezone=UTC
    username: root
    password: password
security:
  user:
    name: admin
    password: admin123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

jwt:
  secret: mySecretKeyForJWT12345678901234567890
  expiration: 3600000

logging:
  file:
    name: logs/user-management.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
